    <path d="M62 112 C58 92 34 74 6 40 C40 36 66 62 62 112 Z" fill="#5B6F3A"/>
    <path d="M60 104 C52 80 36 62 16 46" fill="none" stroke="#3E4F26" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
