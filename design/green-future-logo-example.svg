  <text x="210" y="100" font-family="Cardo, Georgia, serif" font-size="58" fill="#283618">Green Future</text>
  <text x="212" y="134" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4.5" fill="#6B8638">SOLAR · STORAGE · AUTOMATION</text>
